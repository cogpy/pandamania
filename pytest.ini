[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    e2e: End-to-end tests that require AIML interpreter
    slow: Slow running tests (deselect with -m "not slow")
    metacognition: Meta-cognition layer tests
    autognosis: Autognosis system tests
    holistic: Holistic metamodel tests
    learning: Learning system tests
    domain: Domain knowledge tests
    conversation: Conversation flow tests
    performance: Performance benchmark tests

# Output settings
addopts = -v --tb=short --strict-markers

# Timeout for tests (in seconds)
timeout = 30

# Coverage settings
[coverage:run]
source = .
omit = 
    tests/*
    */__pycache__/*
    .git/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
